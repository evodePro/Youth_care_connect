<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pending Approval | YouthCare Connect</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <!-- Supabase CDN (UMD Version for file:// support) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
</head>
<body class="auth-page">
  <div class="hero-bg">
    <div class="hero-overlay" style="opacity: 0.95; background: linear-gradient(135deg, #0F766E 0%, #0D9488 40%, #14B8A6 100%);"></div>
  </div>

  <nav class="navbar scrolled" style="background: transparent; border-bottom: none;">
    <div class="nav-container">
      <a href="../index.html" class="logo" style="text-decoration:none; color:inherit;">
        <img src="../assets/youthcare_logo.png" alt="YouthCare Logo" />
        YouthCare Connect
      </a>
      <div class="nav-links">
        <a href="#" id="logoutBtn" style="cursor:pointer;">Log Out</a>
      </div>
    </div>
  </nav>

  <main class="auth-container">
    <div class="auth-card" id="authCard" style="text-align: center;">
      <h2 class="mb-4">Account Pending</h2>
      <p class="opacity-70 mb-5">Your consultant registration was successful! However, for security purposes, an admin must verify your credentials before you can access the dashboard. Please check back later.</p>
      
      <div style="font-size:3rem; margin-bottom:24px;">⏳</div>
      <button class="btn btn-outline w-100" onclick="window.location.reload();">Refresh Status</button>
    </div>
  </main>

  <script src="../supabase-config.js"></script>
  <script src="middleware.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      gsap.fromTo("#authCard", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8 });

      const client = window.supabaseClient;
      if (!client) return;

      // 1. Get current user
      const { data: { session } } = await client.auth.getSession();
      if (!session) return;

      const userId = session.user.id;

      // 2. Real-time listener for "is_approved" changes
      // This will automatically redirect the user as soon as an admin approves them
      const channel = client
        .channel('public:advisors')
        .on(
          'postgres_changes',
          {
            event: 'UPDATE',
            schema: 'public',
            table: 'advisors',
            filter: `id=eq.${userId}`
          },
          (payload) => {
            console.log('Status change detected:', payload);
            if (payload.new.is_approved === true) {
              window.location.href = 'dashboard.html';
            }
          }
        )
        .subscribe();

      // Logout logic
      document.getElementById('logoutBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        await client.auth.signOut();
        window.location.href = 'login.html';
      });
    });
  </script>
</body>
</html>
