<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consultant Dashboard | YouthCare Connect</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <!-- Supabase CDN (UMD Version for file:// support) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
</head>
<body style="background: var(--color-bg);">

  <nav class="navbar scrolled">
    <div class="nav-container">
      <div class="logo" style="color:var(--color-primary); font-weight:700;">
        <img src="../assets/youthcare_logo.png" alt="YouthCare Logo" />
        YCC Advisor
      </div>
      <div class="nav-links">
        <a href="#" style="color:var(--color-text);">Active Sessions</a>
        <a href="#" style="color:var(--color-text-light);">History</a>
      </div>
      <div class="nav-actions" style="display:flex; align-items:center;">
        <div id="advisorProfilePic" style="width: 36px; height: 36px; border-radius: 50%; background: var(--color-accent-soft); color: var(--color-accent); display: none; align-items: center; justify-content: center; margin-right: 12px; font-weight: bold; overflow: hidden; border: 2px solid var(--color-card-border);"></div>
        <span id="advisorName" style="color:var(--color-text); font-weight:500; margin-right:16px;">Loading...</span>
        <button class="btn btn-outline" id="logoutBtn">Log Out</button>
      </div>
    </div>
  </nav>

  <main class="container" style="padding-top: 100px; padding-bottom: 60px;">
    <h1 style="font-size: 2.5rem; margin-bottom: 8px; color: var(--color-text);">Incoming Requests</h1>
    <p class="mb-5" style="color: var(--color-text-light);">Youth users currently waiting for an advisor.</p>

    <div id="queueList" style="background: var(--color-card-bg); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border: 1px solid var(--color-card-border); overflow: hidden;">
      
    </div>
  </main>

  <!-- Load Config First -->
  <script src="../supabase-config.js"></script>
  <!-- Then Middleware -->
  <script src="middleware.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const queueList = document.getElementById('queueList');
      const advisorNameEl = document.getElementById('advisorName');
      
      if (!window.supabaseClient) {
        console.error("Supabase not initialized");
        return;
      }

      // 1. Get Current Session
      const { data: { session } } = await window.supabaseClient.auth.getSession();
      if (!session) return; // Middleware handles redirection

      // 2. Fetch Profile Info
      const { data: profile } = await window.supabaseClient
        .from('advisors')
        .select('full_name, profile_picture_url')
        .eq('id', session.user.id)
        .single();
      
      if (profile) {
        advisorNameEl.innerText = `${profile.full_name}`;
        const picEl = document.getElementById('advisorProfilePic');
        picEl.style.display = 'flex';
        
        if (profile.profile_picture_url) {
          picEl.innerHTML = `<img src="${profile.profile_picture_url}" style="width: 100%; height: 100%; object-fit: cover;" alt="Profile" />`;
        } else {
          picEl.innerText = profile.full_name.charAt(0).toUpperCase();
        }
      }

      // 3. Initial Fetch of Active Chats
      async function fetchActiveQueue() {
        console.log("Dashboard: Fetching queue for advisor ID:", session.user.id);
        
        const { data: chats, error } = await window.supabaseClient
          .from('chats')
          .select('*')
          .eq('advisor_id', session.user.id)
          .eq('is_active', true)
          .order('created_at', { ascending: false });

        console.log("Dashboard: Query result:", { chats, error });

        if (error) {
          console.error("Queue fetch error", error);
          queueList.innerHTML = `<div style="text-align:center; padding:40px; color:red;">Error loading chats: ${error.message}</div>`;
          return;
        }

        renderQueue(chats, session.user.id);
      }

      function renderQueue(chats, currentUserId) {
        if (!chats || chats.length === 0) {
          queueList.innerHTML = `
            <div style="text-align:center; padding:48px 20px;">
              <div style="font-size: 2.5rem; margin-bottom: 16px;">💬</div>
              <h3 style="color: var(--color-text); margin-bottom: 8px;">No active chat requests</h3>
              <p style="opacity:0.6; font-size: 0.95rem;">When a youth user connects, their chat will appear here.</p>
            </div>`;
          return;
        }

        const chatsHtml = chats.map(chat => {
          const startTime = new Date(chat.created_at);
          const timeElapsed = Math.floor((new Date() - startTime) / 60000);
          const timeLabel = timeElapsed < 1 ? 'Just now' : `${timeElapsed}m ago`;
          
          return `
            <div style="display:flex; justify-content:space-between; align-items:center; padding: 20px 24px; border-bottom: 1px solid var(--color-card-border);">
              <div style="display:flex; align-items:center; gap: 12px;">
                <div style="width:44px; height:44px; border-radius:50%; background: var(--color-accent-soft); color: var(--color-accent); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:1.1rem;">
                  ${chat.youth_username.charAt(0).toUpperCase()}
                </div>
                <div>
                  <h4 style="font-size:1.1rem; margin-bottom:4px; color:var(--color-text);">${chat.youth_username}</h4>
                  <p style="margin:0; font-size:0.85rem; color:var(--color-text-light); max-width:none;">Started: ${timeLabel}</p>
                </div>
              </div>
              <div style="display:flex; gap:8px; flex-shrink:0;">
                <button class="btn btn-primary" onclick="window.location.href='chat.html?chatId=${chat.id}'">Enter Chat</button>
                <button class="btn btn-outline" onclick="endChatSession('${chat.id}')">End</button>
              </div>
            </div>
          `;
        }).join('');
        
        queueList.innerHTML = `
          <div style="padding: 16px 24px; border-bottom: 1px solid var(--color-card-border); display:flex; justify-content:space-between; align-items:center; background: var(--color-bg);">
            <span style="font-weight:600; color:var(--color-text);">${chats.length} Active Chat${chats.length > 1 ? 's' : ''}</span>
            <span style="font-size:0.85rem; color:var(--color-accent); font-weight:500;">● Live</span>
          </div>
          ${chatsHtml}`;
      }

      // End Chat from dashboard
      window.endChatSession = async function(chatId) {
        if (confirm('Are you sure you want to end this chat session?')) {
          try {
            await window.endChat(chatId);
            fetchActiveQueue(); // Refresh list
          } catch (err) {
            console.error("Error ending chat:", err);
          }
        }
      };

      // 4. Real-time Subscription for New Chats
      window.supabaseClient
        .channel('dashboard_chats')
        .on('postgres_changes', { 
          event: '*', 
          schema: 'public', 
          table: 'chats',
          filter: `advisor_id=eq.${session.user.id}`
        }, (payload) => {
          fetchActiveQueue(); // Refresh the list on any change
        })
        .subscribe();

      // Initial Call
      fetchActiveQueue();

      // Logout handler
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await window.supabaseClient.auth.signOut();
        window.location.href = 'login.html';
      });
    });
  </script>
</body>
</html>
