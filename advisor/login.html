<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advisor Login | YouthCare Connect</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <!-- Supabase CDN (UMD Version for file:// support) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
</head>
<body class="auth-page">
  <div class="hero-bg">
    <div class="hero-overlay" style="opacity: 0.95; background: linear-gradient(135deg, #0F766E 0%, #0D9488 40%, #14B8A6 100%);"></div>
  </div>

  <nav class="navbar scrolled" style="background: transparent; border-bottom: none;">
    <div class="nav-container">
      <a href="../index.html" class="logo" style="text-decoration:none; color:inherit;">
        <img src="../assets/youthcare_logo.png" alt="YouthCare Logo" />
        YouthCare Connect
      </a>
      <div class="nav-links">
        <a href="../index.html">Back to Home</a>
      </div>
    </div>
  </nav>

  <main class="auth-container">
    <div class="auth-card" id="authCard">
      <h2 class="mb-4">Consultant Login</h2>
      <p class="opacity-70 mb-5">Sign in to your dashboard using Supabase Auth.</p>
      
      <form id="loginForm">
        <div class="input-group">
          <label>Work Email</label>
          <input type="email" id="email" placeholder="name@facility.org" required />
        </div>
        
        <div class="input-group mb-5">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        
        <button type="submit" class="btn btn-primary w-100" id="loginBtn">Access Portal</button>
      </form>
      
      <div class="auth-footer mt-4 text-center">
        <p class="opacity-70 mb-2" style="font-size: 0.9rem;">Don't have an account? <a href="register.html" style="color:var(--color-primary);">Register here</a></p>
      </div>
    </div>
  </main>

  <!-- Load Config First -->
  <script src="../supabase-config.js"></script>
  <!-- Then Middleware -->
  <script src="middleware.js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      gsap.fromTo("#authCard", { y: 50, opacity: 0, scale: 0.95 }, { y: 0, opacity: 1, scale: 1, duration: 0.8 });
      
      const form = document.getElementById('loginForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        btn.innerText = "Signing in...";
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
          const { data: authData, error: authErr } = await window.supabaseClient.auth.signInWithPassword({ email, password });
          
          if (authErr) {
            alert("Login error: " + authErr.message);
            btn.innerText = "Access Portal";
            return;
          }

          // 2. Check if the advisor is approved in the database
          const { data: profile, error: profileErr } = await window.supabaseClient
            .from('advisors')
            .select('is_approved')
            .eq('id', authData.user.id)
            .single();

          if (profileErr || !profile) {
            await window.supabaseClient.auth.signOut();
            alert("We couldn't find your advisor profile. Please contact support.");
            btn.innerText = "Access Portal";
            return;
          }

          // 3. Redirect to dashboard. 
          // Middleware will automatically catch them and push to pending.html if not approved.
          window.location.href = 'dashboard.html';
        } catch (err) {
          console.error("Login crash", err);
          alert("A connection error occurred: " + (err.message || err));
          btn.innerText = "Access Portal";
        }
      });
    });
  </script>
</body>
</html>
